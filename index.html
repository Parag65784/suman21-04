<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Title & Description -->
    <title>CrickWin - Fantasy Cricket News & Prediction Platform</title>
    <meta
      name="description"
      content="CrickWin is your ultimate fantasy cricket platform for live match updates, game predictions, team insights, and expert analysis. Join now and play smarter!"
    />
    <meta
      name="keywords"
      content="CrickWin, fantasy cricket, Dream11 alternative, cricket predictions, live scores, cricket news, sports betting, cricket fantasy app, win real rewards"
    />
    <meta name="author" content="CrickWin Media" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.crickwinmedia.site/" />
    <meta
      property="og:title"
      content="CrickWin - Fantasy Cricket News & Prediction Platform"
    />
    <meta
      property="og:description"
      content="Get real-time cricket news, live match predictions, and fantasy insights. Experience next-level cricket gaming with CrickWin."
    />
    <meta
      property="og:image"
      content="https://www.crickwinmedia.site/og-image.jpg"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@crickwinmedia
" />
    <meta
      name="twitter:title"
      content="CrickWin - Fantasy Cricket News & Prediction Platform"
    />
    <meta
      name="twitter:description"
      content="Play, predict, and win with CrickWin! The most engaging fantasy cricket and prediction experience."
    />
    <meta
      name="twitter:image"
      content="https://www.crickwinmedia.site/og-image.jpg"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0A2540" />

    <!-- Fonts (Optional - can remove if already imported in CSS) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.crickwinmedia.site/" />
  </head>

  <body class="bg-[#0A2540] text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
